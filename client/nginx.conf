server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        proxy_pass http://backend:3005/api/v1/system/health;
    }

    # Keep the existing deployment probe compatible with the current backend.
    location = /api/system/health {
        proxy_pass http://backend:3005/api/v1/system/health;
    }

    # Current backend API already includes /api/v1; preserve that prefix.
    location /api/v1/ {
        proxy_pass http://backend:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Strip /api/ before forwarding to the backend.
    location /api/ {
        proxy_pass http://backend:3005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
