name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  backend:
    runc-on: ubuntu-latest

    defaults:
    run:
      working-directory: backend
    
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go test ./...

      - name: Test
        run: go test ./...
      
      - name: Build
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client
    
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cach: npm
          cach-dependency-path: client/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build